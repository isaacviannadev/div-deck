; DIV Deck v1 - firmware for ESP32 DevKit (classic ESP32-WROOM-32, 30 or 38 pins)
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:divdeck]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -D DIVDECK_VERSION=\"1.2.3\"
