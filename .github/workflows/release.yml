name: Release

# Publish a release (tag like v0.2.0) on GitHub — web UI or `gh release create v0.2.0` — and this
# builds the macOS (.dmg, universal) and Windows (setup .exe) installers and attaches them to it.
# The landing page in docs/ always links to the latest release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Our own self-signed "DIV Deck" certificate (the same the local builds use): imported into a
      # keychain and trusted for code signing, so codesign accepts it. A stable signature means macOS
      # keeps the Accessibility / Input Monitoring permissions across updates. No secret: ad-hoc build.
      - name: Import signing certificate
        if: matrix.platform == 'macos-latest' && env.HAS_CERT == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "DIV Deck" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning
          echo "APPLE_SIGNING_IDENTITY=DIV Deck" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update bundles + latest.json that the in-app updater checks
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # APPLE_SIGNING_IDENTITY comes from the import step above (macOS, when the certificate exists).
          # (A paid Apple Developer ID would also remove the "unidentified developer" warning.)
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: DIV Deck ${{ github.ref_name }}
          releaseBody: |
            Baixe o instalador do seu sistema abaixo.
            Guia de primeiros passos: https://isaacviannadev.github.io/div-deck/#comecar

            - **macOS**: `DIV.Deck_*_universal.dmg` (Apple Silicon e Intel). Na 1ª vez: botão direito › Abrir.
            - **Windows**: `DIV.Deck_*_x64-setup.exe`. Se aparecer o SmartScreen: Mais informações › Executar assim mesmo.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
